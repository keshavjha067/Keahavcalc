<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeoCalc X</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    *{box-sizing:border-box;font-family:Segoe UI,system-ui;}
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:radial-gradient(circle at top,#0f2027,#000);
    }
    .calculator{
        width:320px;
        padding:20px;
        border-radius:22px;
        backdrop-filter:blur(18px);
        background:rgba(255,255,255,0.08);
        box-shadow:0 0 35px #00f2ff66;
    }
    .screen{
        height:70px;
        background:#050505;
        border-radius:14px;
        color:#00f2ff;
        font-size:2rem;
        text-align:right;
        padding:15px;
        box-shadow:inset 0 0 15px #00f2ff44;
        overflow-x:auto;
    }
    .buttons{
        margin-top:15px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:12px;
    }
    button{
        height:55px;
        border:none;
        border-radius:14px;
        font-size:1.1rem;
        background:#111;
        color:#fff;
        cursor:pointer;
        box-shadow:0 0 12px #00f2ff33;
        transition:0.2s;
    }
    button:hover{
        box-shadow:0 0 22px #00f2ff;
        transform:scale(1.05);
    }
    .op{color:#ff00ff;}
    .equal{
        grid-column:span 2;
        background:#00f2ff;
        color:#000;
        font-weight:bold;
    }
    .clear{color:#ff5555;}
</style>
</head>
<body>

<div class="calculator">
    <div id="screen" class="screen">0</div>
    <div class="buttons">
        <button class="clear" onclick="clearScreen()">C</button>
        <button onclick="del()">⌫</button>
        <button class="op" onclick="press('%')">%</button>
        <button class="op" onclick="press('/')">÷</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="op" onclick="press('*')">×</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="op" onclick="press('-')">−</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="op" onclick="press('+')">+</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
const screen=document.getElementById("screen");
function press(v){screen.innerText=screen.innerText==="0"?v:screen.innerText+v;}
function clearScreen(){screen.innerText="0";}
function del(){screen.innerText=screen.innerText.slice(0,-1)||"0";}
function calculate(){
    try{screen.innerText=eval(screen.innerText);}
    catch{screen.innerText="ERROR";}
}
</script>

</body>
</html>
